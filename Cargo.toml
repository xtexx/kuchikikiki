[package]
name = "kuchikikiki"
version = "0.13.0"
authors = [
  "mwbot-rs Authors",
  "xtex <xtex@astrafall.org>",
  "Brave Authors",
  "Ralph Giles <rgiles@brave.com>",
  "Simon Sapin <simon.sapin@exyr.org>",
]
license = "MIT"
description = "HTML tree manipulation library"
repository = "https://github.com/xtexx/kuchikikiki"
edition = "2024"

[lib]
name = "kuchikikiki"

[dependencies]
cssparser = "0.38.0"
html5ever = "0.40.1"
selectors = "0.41"
indexmap = "2.14.2"
precomputed-hash = "0.1.1"
crc = "3.4.0"
bitflags = "2.13.2"

[dev-dependencies]
tempfile = "=3.27.0"
